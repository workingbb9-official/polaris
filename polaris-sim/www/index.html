<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaris Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div id="select-node" class="hidden-instruction">
            Select a node to send to
        </div>

        <div id="left-sidebar" class="sidebar">
            <div id="info-section" class="sidebar-section">
                <h2>Node Info</h2>
                <div id="info-display" class="sidebar-content">
                    <span class="placeholder-text">No node selected</span>
                </div>
            </div>

            <div id="config-section" class="sidebar-section unified-panel hidden">
                <h2>Node Config</h2>
                <div class="input-group">
                    <label for="node-heartbeat-input">Heartbeat (ms)</label>
                    <input type="number" id="node-heartbeat-input" value="50">
                </div>

                <div class="button-row">
                    <button id="cancel-config-btn" class="btn btn-secondary">Cancel</button>
                    <button id="confirm-config-btn" class="btn btn-primary">Start Placing</button>
                </div>
            </div>
        </div>

        <canvas id="canvas"></canvas>

        <div id="right-sidebar" class="sidebar">
            <div class="top-controls">
                <h2>Commands</h2>
                <div class="button-group">
                    <button id="tick" class="btn btn-secondary">Tick</button>
                    <button id="spawn" class="btn btn-primary">Spawn Node</button>
                </div>
            </div>

            <div class="event-container">
                <h3 class="inner-text">Simulation Uptime</h3>
                <div id="time-box" class="display-box">0</div>
            </div>

            <div class="event-container">
                <h3 class="inner-text">Last Event</h3>
                <div class="display-box">---</div>
            </div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
